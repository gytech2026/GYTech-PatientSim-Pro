    <rect x="225" y="512" width="242" height="34" rx="3" fill="#08191f" stroke="#2b5260"/>
    <text x="237" y="534" fill="#8bc7d5" font-family="Consolas, monospace" font-size="11" letter-spacing="1">MULTIPARAMETER MONITORING</text>
