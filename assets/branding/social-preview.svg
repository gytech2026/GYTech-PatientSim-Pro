<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="GYTech PatientSim Pro social preview">
  <defs>
    <linearGradient id="socialBg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061419"/>
      <stop offset="0.62" stop-color="#05090b"/>
      <stop offset="1" stop-color="#071014"/>
    </linearGradient>
    <linearGradient id="socialLine" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d9ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="socialPulse" x1="100" y1="300" x2="1180" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00d9ff"/>
      <stop offset="0.6" stop-color="#00ff66"/>
      <stop offset="1" stop-color="#ffd740"/>
    </linearGradient>
    <pattern id="socialGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#25505b" stroke-width="1" opacity="0.18"/>
    </pattern>
    <filter id="socialGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#socialBg)"/>
  <rect width="1280" height="640" fill="url(#socialGrid)"/>
  <circle cx="1120" cy="100" r="260" fill="#00d9ff" opacity="0.035"/>
