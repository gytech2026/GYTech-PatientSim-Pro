    <path d="M18 126h35l12-31 21 56 14-31h54" fill="none" stroke="url(#socialPulse)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#socialGlow)"/>
    <circle cx="141" cy="35" r="6" fill="#00d9ff"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
