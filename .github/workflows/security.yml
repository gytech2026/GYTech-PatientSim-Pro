name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-secret-review:
    name: Dependency audit and secret review
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install declared dependencies
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report full dependency audit without blocking on dev tooling
        run: npm audit --audit-level=high || true
      - name: Run local secret signature scan
        run: npm run check:secrets
      - name: Static repository validation
        run: npm run validate
