name: Code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  static-validation:
    name: Structure, syntax, links and screenshots
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install declared dependencies
        run: npm ci
      - name: Validate repository
        run: npm run validate
      - name: Check for common secret signatures
        run: npm run check:secrets
      - name: Confirm Pages build can be prepared
        run: npm run build:pages
