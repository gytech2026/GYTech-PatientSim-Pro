name: Deploy GitHub Pages

# Manual by default. Enable the push trigger only after the owner has confirmed
# the repository, Pages environment, and publication decision.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: Prepare static site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install declared dependencies
        run: npm ci
      - name: Prepare Pages artefact
        run: npm run build:pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
